<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLO Evaluation Results</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwind CSS Custom Configuration (Optional)
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'fulfilled-yes': '#10B981', // Emerald 500
                        'fulfilled-no': '#EF4444',  // Red 500
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Additional custom styles if needed */
        .table-cell-fulfilled-yes {
            background-color: #D1FAE5; /* Emerald 100 */
            color: #065F46; /* Emerald 800 */
            font-weight: 600; /* semibold */
        }
        .table-cell-fulfilled-no {
            background-color: #FEE2E2; /* Red 100 */
            color: #991B1B; /* Red 800 */
            font-weight: 600; /* semibold */
        }
    </style>
</head>
<body class="bg-gradient-to-r from-blue-50 to-indigo-100 min-h-screen py-8 px-4 sm:px-6 lg:px-8">
    <div class="max-w-5xl w-full mx-auto space-y-8 p-6 sm:p-10 bg-white shadow-xl rounded-xl">
        <div>
            <h2 class="mt-6 text-center text-3xl sm:text-4xl font-extrabold text-gray-900">
                CLO Evaluation Results
            </h2>
            <p class="mt-2 text-center text-lg text-indigo-700 font-semibold" th:text="${assessmentType}">
                Assessment Type
            </p>
        </div>

        <div th:if="${students == null or #lists.isEmpty(students)}" class="text-center p-6 bg-yellow-50 border border-yellow-300 rounded-md">
            <p class="text-lg font-medium text-yellow-700">No evaluation data available to display.</p>
            <p class="text-sm text-yellow-600">Please go back and submit the evaluation form.</p>
        </div>

        <div th:if="${students != null and not #lists.isEmpty(students)}" class="overflow-x-auto shadow-md rounded-lg">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-indigo-600">
                    <tr>
                        <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">Student ID</th>
                        <th scope="col" th:each="clo, iterStat : ${students[0].cloPercentages}"
                            th:text="'CLO ' + ${iterStat.index + 1} + ' (%)'"
                            class="px-4 py-3 text-center text-xs font-medium text-white uppercase tracking-wider"></th>
                        <th scope="col" class="px-4 py-3 text-center text-xs font-medium text-white uppercase tracking-wider">Overall Avg (%)</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <tr th:each="student, rowStat : ${students}" th:class="${rowStat.odd ? 'bg-gray-50' : 'bg-white'}">
                        <td class="px-4 py-3 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${student.id}"></td>
                        <td th:each="percent : ${student.cloPercentages}"
                            th:text="${#numbers.formatDecimal(percent, 1, 'NONE', 2, 'POINT')}"
                            class="px-4 py-3 whitespace-nowrap text-sm text-gray-700 text-center"></td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-700 text-center font-semibold"
                            th:text="${#numbers.formatDecimal(student.overallAverage, 1, 'NONE', 2, 'POINT')}"></td>
                    </tr>
                </tbody>
                <tfoot class="bg-gray-100 border-t-2 border-gray-300">
                    <tr>
                        <td class="px-4 py-3 text-left text-sm font-bold text-gray-800">Class Average</td>
                        <td th:each="avg : ${classAverages}"
                            th:text="${#numbers.formatDecimal(avg, 1, 'NONE', 2, 'POINT')}"
                            class="px-4 py-3 text-center text-sm font-semibold text-gray-700"></td>
                        <td class="px-4 py-3"></td> </tr>
                    <tr>
                        <td class="px-4 py-3 text-left text-sm font-bold text-gray-800">Fulfilled (≥ 60%)</td>
                        <td th:each="fulfill : ${fulfillment}"
                            th:text="${fulfill ? 'Yes' : 'No'}"
                            th:classappend="${fulfill ? 'table-cell-fulfilled-yes' : 'table-cell-fulfilled-no'}"
                            class="px-4 py-3 text-center text-sm"></td>
                        <td class="px-4 py-3"></td> </tr>
                </tfoot>
            </table>
        </div>

        <div class="mt-8 text-center">
            <a href="/"
               class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                </svg>
                Back to Form
            </a>
        </div>
    </div>
</body>
</html>
