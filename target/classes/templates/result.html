<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLO Evaluation Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            font-family: 'Arial', sans-serif; /* Bootstrap default or your preferred font */
            background-color: #f8f9fa; /* Light gray background */
        }
        .container-custom {
            max-width: 1140px; /* Bootstrap's .container-lg equivalent */
        }
        .table th, .table td {
            vertical-align: middle;
        }
        /* Custom styles for fulfilled status for better visual distinction */
        .status-yes {
            color: var(--bs-success-text-emphasis);
            background-color: var(--bs-success-bg-subtle);
            font-weight: bold;
        }
        .status-no {
            color: var(--bs-danger-text-emphasis);
            background-color: var(--bs-danger-bg-subtle);
            font-weight: bold;
        }
    </style>
</head>
<body class="d-flex flex-column align-items-center min-vh-100 py-4">
    <div class="container container-custom">
        <div class="card shadow-lg p-3 p-md-4 p-lg-5">
            <div class="card-body">
                <h2 class="card-title text-center fw-bold mb-3">
                    CLO Evaluation Results
                </h2>
                <p class="text-center h5 text-primary mb-4" th:text="${assessmentType}">
                    Assessment Type
                </p>

                <div th:if="${students == null or #lists.isEmpty(students)}" class="alert alert-warning text-center" role="alert">
                    <h4 class="alert-heading fw-bold">No Data!</h4>
                    <p>No evaluation data available to display.</p>
                    <hr>
                    <p class="mb-0">Please go back and submit the evaluation form first.</p>
                </div>

                <div th:if="${students != null and not #lists.isEmpty(students)}" class="table-responsive shadow-sm rounded">
                    <table class="table table-striped table-hover table-bordered caption-top">
                        <caption class="text-center text-muted p-2">Detailed evaluation results per student and class averages.</caption>
                        <thead class="table-dark">
                            <tr>
                                <th scope="col" class="text-start ps-3">Student ID</th>
                                <th scope="col" th:each="clo, iterStat : ${students[0].cloPercentages}"
                                    th:text="'CLO ' + ${iterStat.index + 1} + ' (%)'"
                                    class="text-center"></th>
                                <th scope="col" class="text-center">Overall Avg (%)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="student : ${students}">
                                <td class="text-start ps-3 fw-medium" th:text="${student.id}"></td>
                                <td th:each="percent : ${student.cloPercentages}"
                                    th:text="${#numbers.formatDecimal(percent, 1, 'NONE', 2, 'POINT')}"
                                    class="text-center"></td>
                                <td class="text-center fw-semibold"
                                    th:text="${#numbers.formatDecimal(student.overallAverage, 1, 'NONE', 2, 'POINT')}"></td>
                            </tr>
                        </tbody>
                        <tfoot class="table-group-divider">
                            <tr>
                                <td class="text-start ps-3 fw-bold">Class Average</td>
                                <td th:each="avg : ${classAverages}"
                                    th:text="${#numbers.formatDecimal(avg, 1, 'NONE', 2, 'POINT')}"
                                    class="text-center fw-semibold"></td>
                                <td class="text-center"></td> </tr>
                            <tr>
                                <td class="text-start ps-3 fw-bold">Fulfilled (≥ 60%)</td>
                                <td th:each="fulfill : ${fulfillment}"
                                    th:text="${fulfill ? 'Yes' : 'No'}"
                                    th:classappend="${fulfill ? 'status-yes' : 'status-no'}"
                                    class="text-center"></td>
                                <td class="text-center"></td> </tr>
                        </tfoot>
                    </table>
                </div>

                <div class="mt-4 pt-3 text-center border-top">
                    <a href="/" class="btn btn-primary btn-lg d-inline-flex align-items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-arrow-left-circle me-2" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8m15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-4.5-.5a.5.5 0 0 1 0 1H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5z"/>
                        </svg>
                        Back to Form
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
