<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLO Evaluation Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            font-family: 'Arial', sans-serif; /* Bootstrap default or your preferred font */
            background-color: #f8f9fa;
        }
        .container-custom {
            max-width: 960px; /* Or your preferred max-width */
        }
        /* Optional: Custom styling for dynamically added elements if needed, though Bootstrap classes should cover most */
        #scoresContainer .card-body {
             padding: 1.5rem; /* Adjust padding for student cards */
        }
    </style>
    <script>
        function updateForm() {
            const assessmentType = document.getElementById('assessmentType').value;
            const totalStudents = parseInt(document.getElementById('totalStudents').value);
            const container = document.getElementById('scoresContainer');
            container.innerHTML = ''; // Clear previous content

            if (!assessmentType) {
                 container.innerHTML = '<div class="alert alert-warning text-center" role="alert">Please select an assessment type first.</div>';
                return;
            }

            if (!totalStudents || totalStudents <= 0) {
                container.innerHTML = '<div class="alert alert-danger text-center" role="alert">Please enter a valid number of students (minimum 1).</div>';
                return;
            }

            let cloCount = 0;
            let maxMarks = [];

            // Define CLO structures based on assessment type
            if (assessmentType === 'Midterm') {
                cloCount = 4;
                maxMarks = [5, 5, 5, 5];
            } else if (assessmentType === 'Final') {
                cloCount = 4;
                maxMarks = [12.5, 12.5, 12.5, 12.5];
            } else if (assessmentType === 'Assignment') {
                cloCount = 1;
                maxMarks = [10];
            } else {
                container.innerHTML = '<div class="alert alert-info text-center" role="alert">CLO structure not defined for the selected assessment type.</div>';
                return;
            }

            for (let i = 0; i < totalStudents; i++) {
                const studentCard = document.createElement('div');
                studentCard.className = 'card shadow-sm mb-4'; // Bootstrap card for each student

                const studentCardHeader = document.createElement('div');
                studentCardHeader.className = 'card-header bg-light';
                studentCardHeader.innerHTML = `<h5 class="mb-0">Student ${i + 1}</h5>`;
                studentCard.appendChild(studentCardHeader);

                const studentCardBody = document.createElement('div');
                studentCardBody.className = 'card-body';


                for (let j = 0; j < cloCount; j++) {
                    const formGroup = document.createElement('div');
                    formGroup.className = 'mb-3'; // Bootstrap form group

                    const label = document.createElement('label');
                    label.textContent = `CLO ${j + 1} (Max ${maxMarks[j]}): `;
                    label.className = 'form-label'; // Bootstrap label
                    label.htmlFor = `student_${i}_clo_${j}`;

                    const input = document.createElement('input');
                    input.type = 'number';
                    input.name = `student_${i}_clo_${j}`;
                    input.id = `student_${i}_clo_${j}`;
                    input.min = 0;
                    input.max = maxMarks[j];
                    input.step = '0.01';
                    input.required = true;
                    input.className = 'form-control'; // Bootstrap form control

                    formGroup.appendChild(label);
                    formGroup.appendChild(input);
                    // Placeholder for Bootstrap validation feedback
                    const invalidFeedbackDiv = document.createElement('div');
                    invalidFeedbackDiv.className = 'invalid-feedback';
                    formGroup.appendChild(invalidFeedbackDiv);

                    studentCardBody.appendChild(formGroup);
                }
                studentCard.appendChild(studentCardBody);
                container.appendChild(studentCard);
            }
        }

        function validateForm() {
            const inputs = document.querySelectorAll('#scoresContainer input[type="number"]');
            let allValid = true;

            // Clear previous general error messages
            const generalErrorArea = document.getElementById('generalErrorArea');
            if (generalErrorArea) generalErrorArea.innerHTML = '';


            inputs.forEach(input => {
                // Clear previous validation states and messages for this input
                input.classList.remove('is-invalid', 'is-valid');
                const feedbackDiv = input.parentNode.querySelector('.invalid-feedback');
                if (feedbackDiv) feedbackDiv.textContent = '';

                const max = parseFloat(input.max);
                const val = parseFloat(input.value);
                const min = parseFloat(input.min);

                if (input.required && (input.value === '' || input.value === null)) {
                    allValid = false;
                    input.classList.add('is-invalid');
                    if (feedbackDiv) feedbackDiv.textContent = 'This field is required.';
                } else if (input.value !== '' && (val < min || val > max)) {
                    allValid = false;
                    input.classList.add('is-invalid');
                    if (feedbackDiv) feedbackDiv.textContent = `Score must be between ${min} and ${max}.`;
                } else if (input.value !== '') {
                    input.classList.add('is-valid'); // Optional: style valid inputs
                }
            });

            if (!allValid) {
                if (generalErrorArea) {
                    generalErrorArea.innerHTML = '<div class="alert alert-danger text-center" role="alert">Please correct the errors in the form.</div>';
                } else {
                     alert("Please correct the errors highlighted in the form."); // Fallback
                }
            }
            return allValid;
        }
    </script>
</head>
<body class="d-flex flex-column align-items-center justify-content-center min-vh-100 py-4">
    <div class="container container-custom">
        <div class="card shadow-lg p-3 p-md-4 p-lg-5">
            <div class="card-body">
                <h2 class="card-title text-center fw-bold mb-4">
                    CLO Evaluation Form
                </h2>
                <p class="text-center text-muted mb-4">
                    Fill in the details below to evaluate Course Learning Outcomes.
                </p>

                <div id="generalErrorArea" class="mb-3"></div>

                <form action="/evaluate" method="post" onsubmit="return validateForm()" class="needs-validation" novalidate>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="assessmentType" class="form-label">Assessment Type:</label>
                            <select id="assessmentType" name="assessmentType" onchange="updateForm()" required class="form-select">
                                <option value="">Select Type...</option>
                                <option value="Midterm">Midterm</option>
                                <option value="Final">Final</option>
                                <option value="Assignment">Assignment</option>
                            </select>
                            <div class="invalid-feedback">Please select an assessment type.</div>
                        </div>
                        <div class="col-md-6">
                            <label for="totalStudents" class="form-label">Total Number of Students:</label>
                            <input type="number" id="totalStudents" name="totalStudents" min="1" onchange="updateForm()" required class="form-control">
                            <div class="invalid-feedback">Please enter a valid number of students.</div>
                        </div>
                    </div>

                    <div id="scoresContainer" class="mb-4">
                        <p class="text-center text-muted p-3" id="initialMessage">Please select an assessment type and enter the number of students to populate scores.</p>
                    </div>

                    <div th:if="${error}" class="alert alert-danger mt-3" role="alert">
                        <h6 class="alert-heading">Error!</h6>
                        <p th:text="${error}"></p>
                    </div>

                    <div class="mt-4 d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            Submit Evaluation
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
         document.addEventListener('DOMContentLoaded', function() {
            if (document.getElementById('assessmentType').value && document.getElementById('totalStudents').value > 0) {
                const initialMsgElement = document.getElementById('initialMessage');
                if (initialMsgElement) initialMsgElement.style.display = 'none';
                updateForm();
            }

            // Bootstrap's own form validation handling (optional, if you want to use it alongside your custom JS)

            //         }, false);

        });
    </script>
</body>
</html>
